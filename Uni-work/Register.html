<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servix - Register</title>
    <link rel="stylesheet" href="/Register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <h1>Servix</h1>
    </header>
    <div class="con">
        <h2>Register</h2>
        <form action="/register" method="POST">
            <div class="field-row">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="User Name" required>
                <i class="fa fa-user-o" aria-hidden="true"></i>
            </div>

            <div class="field-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="User Email" required>
                <i class="fa fa-envelope" aria-hidden="true"></i>
            </div>

            <div class="field-row">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
                <i class="fa fa-phone" aria-hidden="true"></i>
            </div>

            <div class="field-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <i class="fa fa-lock" aria-hidden="true"></i>
            </div>

            <div class="field-row">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>
                <i class="fa fa-lock" aria-hidden="true"></i>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember" >
                <label for="remember">Remember Me</label>
            </div>

            <div>
                <button type="submit"><i class="fa fa-sign-in" aria-hidden="true"></i> Register</button>
                <a href="./LogIn.html"><button type="button">Have an account already?</button></a>
            </div>
        </form>
    </div>
    <footer>
        <p>&copy; 2026 Servix. All rights reserved.</p>
    </footer>
    
</body>
</html>
